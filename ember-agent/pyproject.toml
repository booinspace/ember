[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "ember-agent"
version = "0.1.0"
description = "Memory-aware character slice and local P0 gateway for Ember"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ember-memory-abi==0.5.0",
    "pydantic>=2.10,<3",
    "tzdata>=2025.2,<2027",
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "mcp==2.3.0",
    "psutil>=7.2.2,<8",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "livekit-agents>=1.8.5,<1.9",
    "livekit>=1.1.20,<2",
    "livekit-api>=1.2.1,<2",
]

[project.optional-dependencies]
local-deployment = ["ember-memory-engine[search,processing]==0.7.0"]
audio = [
    "faster-whisper>=1.2,<2",
    "livekit-plugins-silero>=1.8.5,<1.9",
    "livekit-plugins-openai>=1.8.5,<1.9",
]

[project.scripts]
ember = "ember_agent.cli:main"
ember-agent = "ember_agent.cli:main"

[tool.uv.sources]
ember-memory-abi = { path = "../ember-memory/packages/memory-abi", editable = true }
ember-memory-engine = { path = "../ember-memory/packages/memory-engine", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ember_agent"]
