# Copy to deployment.local.toml before adding machine-specific details.
# Relative paths resolve against this file's directory, not the shell's cwd.
config_version = 1
active_profile = "primary"
# Route specific questions like "Do you remember what caused the NAS outage?"
# to deep recall in voice and browser chat. Ordinary turns stay on fast recall.
natural_deep_recall = false
# Optional preview: filter hybrid archive expansion only during deep recall.
# deep_archive_relevance = "corroborated_v1"

[paths]
data_root = "../../.local/data"
runtime_root = "../../.local/runtime"

[model]
# REQUIRED before phase 3 generation: the actual Ollama inventory tag and digest.
# A user-facing model name is not a runtime identity.
tag = ""
expected_digest = ""
context_tokens = 8192
max_input_tokens = 7000
output_reserve_tokens = 1024

[services.ollama]
endpoint = "http://127.0.0.1:11434"
mode = "attach"

[services.livekit]
endpoint = "ws://127.0.0.1:7880"
mode = "attach"
# For ember start: set mode to managed after explicit setup, or attach with existing credentials.
executable = "../../.local/tools/livekit/1.13.9/livekit-server.exe"
credentials_file = "../../.local/runtime/livekit-credentials.json"
tcp_port = 7881
udp_port = 7882
startup_timeout_seconds = 20.0
shutdown_timeout_seconds = 30.0

[services.tts]
endpoint = "http://127.0.0.1:8880"
mode = "attach"
# Managed mode launches an explicitly installed CPU server command; no shell or setup at startup.
executable = ""
arguments = []
working_directory = ""
startup_timeout_seconds = 20.0

[gateway]
endpoint = "http://127.0.0.1:11435"
mode = "managed"
# Live voice preemption requires a qualified Strata runner profile.
preemption_enabled = false

[providers.odysseus]
mode = "disabled"

[audio]
enabled = false
# Explicit CPU Phonon setup: scripts/setup_phonon_stt.ps1. Empty keeps Whisper selection.
phonon_endpoint = ""
phonon_executable = ""
phonon_cache_directory = ""
# Whisper is used only when phonon_endpoint is empty; startup never downloads.
stt_model_directory = ""
stt_threads = 2
language = "en"
stt_device = "cpu"
# Phonon deployment defaults. Kokoro uses tts_model="kokoro", e.g. tts_voice="af_alloy".
# Voice IDs belong to the selected provider; Juniper is a Phonon voice.
tts_model = "tts-1"
tts_voice = "Juniper"
tts_speed = 1.1

# Explicit setup only: python scripts/setup_embeddings.py --help
# CPU encoding; absent assets leave canonical/lexical recall available.
[search]
embedding_directory = "" # e.g. "../../.local/models/bge-small-en-v1.5"

timezone = "Europe/London"

[browser]
enabled = false
# Optional LAN access: set your assigned RFC1918 IPv4 address. Empty keeps loopback-only.
# start.ps1 ensures application-scoped Private/Domain LocalSubnet firewall rules.
# Microphone capture from another device requires HTTPS; HTTP LAN supports text/playback.
lan_address = ""
# Optional HTTPS reverse proxy; granting direct access gives LAN users operator authority.
public_origin = ""
trusted_proxy = ""
endpoint = "http://127.0.0.1:8787"
# Build ember-agent/frontend during setup, then point to its production dist directory.
assets = "../frontend/dist"

# Optional OpenCode memory. Omit this section to keep the listener off.
# See docs/opencode-memory.md for credentials, SSH forwarding, and local model privacy.
# [memory_mcp]
# port = 8790
# write_enabled = false # Set true to allow short notes in the OpenCode library.

[interpretation]
# Independent of deep recall. Common calendar queries always resolve locally.
enabled = false
timeout_seconds = 8.0

# Shared across every character/profile pointing to the same file.
# Relative paths resolve from this deployment TOML's directory.
[prompts]
system_file = "prompts/system.md"

# Optional public search; configure exactly one transport.
# [public_search]
# provider = "searxng" # Display label, not a code import.
# searxng_url = "http://your-installed-searxng:8095" # Requires SearXNG JSON format.
# For an independent installed command, use these fields instead:
# provider = "command"
# command = ["C:/installed/python.exe", "-B", "C:/installed/public_search.py"]
# For keyless Exa MCP search and page excerpts, use only provider = "exa_mcp".
# Custom [public_web_mcp.search] and [public_web_mcp.read] bind operations separately.
# See docs/adr/0027-public-web-retrieval.md for configuration and trust boundaries.

# Optional OpenCode task delegation. Omit [harness] to keep delegation disabled.
# [harness]
# provider = "opencode"
# command = ["C:/installed/opencode.exe"]
# revision = "2.3.2" # Installed binary version.
# profile_sha256 = "<lowercase SHA-256 of executable>"
# workspace = "C:/ember-harness-workspace" # Dedicated directory, not Ember data or runtime root.
# private_recall = false
# skills = false
# tools = []
