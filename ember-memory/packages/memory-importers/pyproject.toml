[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "ember-memory-importers"
version = "0.1.0"
description = "Bounded source reconnaissance and resumable canonical JSON normalization"
requires-python = ">=3.12,<3.13"
dependencies = ["ember-memory-abi==0.3.0", "pydantic>=2.10,<3", "ijson>=3.4,<4"]

[tool.uv.sources]
ember-memory-abi = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ember_memory_importers"]
