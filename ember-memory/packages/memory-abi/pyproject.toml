[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "ember-memory-abi"
version = "0.2.0"
description = "Backend-independent Memory ABI and Normalized Archive 0.1 contracts"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.10,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/ember_memory_abi"]
