[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "ember-memory-engine"
version = "0.1.1"
description = "Experimental canonical SQLite memory engine and bounded async facade"
requires-python = ">=3.12,<3.13"
dependencies = ["ember-memory-abi==0.1.0", "pydantic>=2.10,<3"]

[tool.uv.sources]
ember-memory-abi = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ember_memory_engine"]
