[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "ember-memory-engine"
version = "0.5.0"
description = "Experimental canonical SQLite memory engine and bounded async facade"
requires-python = ">=3.12,<3.13"
dependencies = ["ember-memory-abi==0.4.0", "pydantic>=2.10,<3"]

[project.optional-dependencies]
processing = ["httpx>=0.28,<1"]
search = [
    "numpy>=2,<3",
    "onnxruntime>=1.20,<2",
    "sqlite-vec>=0.1.6,<0.2",
    "tokenizers>=0.21,<1",
]

[tool.uv.sources]
ember-memory-abi = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/ember_memory_engine"]
