[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "ember-memory"
version = "0.1.0"
description = "Source import and explicit memory maintenance for Ember"
requires-python = ">=3.12,<3.13"
dependencies = ["ember-memory-importers==0.1.0", "ember-memory-engine[search,processing]==0.5.0"]

[project.scripts]
ember-memory = "ember_memory_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["cli/src/ember_memory_cli"]

[tool.uv.workspace]
members = ["packages/memory-abi", "packages/memory-engine", "packages/memory-importers"]

[tool.uv.sources]
ember-memory-importers = { workspace = true }
ember-memory-abi = { workspace = true }
ember-memory-engine = { workspace = true }
