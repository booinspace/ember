[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "character-memory"
version = "0.0.0"
description = "Phase -1 maintenance CLI for the local character memory platform"
requires-python = ">=3.12,<3.13"
dependencies = ["character-memory-importers==0.0.0"]

[project.scripts]
character-memory = "character_memory_cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["cli/src/character_memory_cli"]

[tool.uv.workspace]
members = ["packages/memory-abi", "packages/memory-engine", "packages/memory-importers"]

[tool.uv.sources]
character-memory-importers = { workspace = true }
character-memory-abi = { workspace = true }
character-memory-engine = { workspace = true }
