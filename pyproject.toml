# Development tooling only. Product packages remain in the two project roots.
[project]
name = "ember-development"
version = "0.0.0"
description = "Shared ember quality tooling; not a product package"
requires-python = ">=3.12,<3.13"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ember-agent[local-deployment]==0.1.0",
    "ember-memory==0.1.0",
    "ember-memory-engine[search,processing]==0.4.0",
    "pytest>=8.3,<10",
    "types-jsonschema>=4.23,<5",
    "pyright>=1.1.390,<2",
    "ruff>=0.9,<1",
]

[tool.uv.sources]
ember-agent = { path = "ember-agent", editable = true }
ember-memory = { path = "ember-memory", editable = true }
ember-memory-abi = { path = "ember-memory/packages/memory-abi", editable = true }
ember-memory-engine = { path = "ember-memory/packages/memory-engine", editable = true }
ember-memory-importers = { path = "ember-memory/packages/memory-importers", editable = true }

[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 4
extend-exclude = [".local", ".cache", "**/.venv"]
src = [
    "ember-agent/src",
    "ember-memory/cli/src",
    "ember-memory/packages/memory-abi/src",
    "ember-memory/packages/memory-engine/src",
    "ember-memory/packages/memory-importers/src",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
include = [
    "ember-agent/src",
    "ember-memory/cli/src",
    "ember-memory/packages/memory-abi/src",
    "ember-memory/packages/memory-engine/src",
    "ember-memory/packages/memory-importers/src",
    "scripts",
]
exclude = ["**/.venv", "**/__pycache__", ".local", ".cache"]
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
testpaths = [
    "ember-memory/tests",
    "ember-memory/packages/memory-abi/tests",
    "ember-memory/packages/memory-engine/tests",
    "ember-memory/packages/memory-importers/tests",
    "ember-agent/tests",
]
addopts = ["--strict-markers", "--import-mode=importlib"]
markers = [
    "integration: tests requiring local services or cross-component integration",
    "end_to_end: tests exercising installed CLI/application entry points",
]
pythonpath = [
    "ember-agent/src",
    "ember-memory/cli/src",
    "ember-memory/packages/memory-abi/src",
    "ember-memory/packages/memory-engine/src",
    "ember-memory/packages/memory-importers/src",
]
