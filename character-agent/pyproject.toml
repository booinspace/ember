[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "character-agent"
version = "0.0.0"
description = "Phase -1 configuration and readiness checks for the local character stack"
requires-python = ">=3.12,<3.13"
dependencies = ["character-memory-abi==0.0.0", "pydantic>=2.10,<3"]

[project.optional-dependencies]
local-deployment = ["character-memory-engine==0.0.0"]

[project.scripts]
character-agent = "character_agent.cli:main"

[tool.uv.sources]
character-memory-abi = { path = "../character-memory/packages/memory-abi", editable = true }
character-memory-engine = { path = "../character-memory/packages/memory-engine", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/character_agent"]
